    {
      "name": "Save File - Replace Original File In Place (atomic) ⏳",
      "sourceRepo": "Community",
      "pluginName": "customFunction",
      "version": "1.0.0",
      "id": "hGbm7CkZ9",
      "position": {
        "x": 2090,
        "y": 1625
      },
      "fpEnabled": true,
      "inputsDB": {
        "code": "module.exports = async (args) => {\n  // Atomic in-place replace. The stock replaceOriginalFile plugin renames the\n  // original away before moving the new file in; a Sonarr disk scan landing in\n  // that gap sees the episode as deleted and recycles its sidecars, including\n  // Tdarr's .tmp (NCIS Hawai'i S02E11, 2026-10-16). Here the original path always\n  // exists: copy into a hidden subfolder, fsync + verify size, then rename() over\n  // the original in one step. The temp must not sit next to the episode: Sonarr's\n  // extra-file import picks up any sibling (even *.partial~) and renames it to\n  // the episode's name (The 100 S07E16, 2026-10-16). Sonarr, Plex and Jellyfin\n  // all skip dot-folders, and it's on the same filesystem so rename() stays atomic.\n  let fsp;\n  try { fsp = require('fs').promises; } catch (e) { fsp = args.deps.fsextra.promises || args.deps.fsextra; }\n  const path = (() => { try { return require('path'); } catch (e) { return args.deps.path; } })();\n\n  const working = args.inputFileObj._id;\n  const original = args.originalLibraryFile._id;\n  if (working === original) {\n    args.jobLog('File unchanged, nothing to replace');\n    return { outputFileObj: args.inputFileObj, outputNumber: 1, variables: args.variables };\n  }\n\n  const target = path.join(path.dirname(original), path.parse(original).name + path.extname(working));\n  const tmpDir = path.join(path.dirname(original), '.tdarr-partial');\n  const tmp = path.join(tmpDir, `${path.basename(target)}.partial~`);\n  const srcSize = (await fsp.stat(working)).size;\n  try {\n    await fsp.mkdir(tmpDir, { recursive: true });\n    await fsp.copyFile(working, tmp);\n    const fh = await fsp.open(tmp, 'r+');\n    await fh.sync();\n    await fh.close();\n    const tmpSize = (await fsp.stat(tmp)).size;\n    if (tmpSize !== srcSize) throw new Error(`copy size mismatch: ${tmpSize} != ${srcSize}`);\n    await fsp.rename(tmp, target);\n  } catch (err) {\n    await fsp.unlink(tmp).catch(() => {});\n    await fsp.rmdir(tmpDir).catch(() => {});\n    throw new Error(`Atomic replace failed, original left untouched: ${err.message}`);\n  }\n  // Another job in the same folder may still be using it; only removed once empty.\n  await fsp.rmdir(tmpDir).catch(() => {});\n  // Container changed (e.g. .mp4 -> .mkv): the new file is in place, drop the old one.\n  if (target !== original) await fsp.unlink(original);\n  args.jobLog(`Replaced in place: ${target} (${srcSize} bytes)`);\n  return { outputFileObj: { _id: target }, outputNumber: 1, variables: args.variables };\n};\n"
      }
    },
    {
      "name": "Save File - Notify Sonarr/Radarr Rescan & Rename 🧮",
      "sourceRepo": "Community",
      "pluginName": "customFunction",
      "version": "1.0.0",
      "inputsDB": {
        "code": "module.exports = async (args) => {\n  // Replace mode: after replacing a library file in place, tell the app that owns\n  // it (Sonarr for series, Radarr for movies) to rescan and rename the new file.\n  // Configure sonarr_url / sonarr_api_key and/or radarr_url / radarr_api_key on the\n  // library; the app whose series or movie folder contains the file is used.\n  // Non-fatal: any problem is logged and the flow continues (output 2).\n  const lib = (args.userVariables && args.userVariables.library) || {};\n  const done = (n) => ({ outputFileObj: args.inputFileObj, outputNumber: n, variables: args.variables });\n  const apps = [\n    {\n      name: 'Sonarr', url: lib.sonarr_url, key: lib.sonarr_api_key,\n      items: 'series', rescan: 'RescanSeries', idField: 'seriesId', files: 'episodefile',\n    },\n    {\n      name: 'Radarr', url: lib.radarr_url, key: lib.radarr_api_key,\n      items: 'movie', rescan: 'RescanMovie', idField: 'movieId', files: 'moviefile',\n    },\n  ].map((a) => ({ ...a, url: String(a.url || '').replace(/\\/+$/, ''), key: String(a.key || '') }))\n    .filter((a) => a.url && a.key);\n  if (!apps.length) {\n    args.jobLog('sonarr_url / sonarr_api_key or radarr_url / radarr_api_key not set, skipping notify');\n    return done(2);\n  }\n\n  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));\n  const file = args.inputFileObj._id;\n  const base = file.replace(/\\.[^./]+$/, '');\n\n  for (const app of apps) {\n    const api = async (path, opts = {}) => {\n      const res = await fetch(`${app.url}/api/v3/${path}`, {\n        ...opts, headers: { 'X-Api-Key': app.key, 'Content-Type': 'application/json' },\n      });\n      if (!res.ok) throw new Error(`${opts.method || 'GET'} ${path} -> HTTP ${res.status}`);\n      const text = await res.text();\n      return text ? JSON.parse(text) : null;\n    };\n    const waitFor = async (cmd) => {\n      for (let i = 0; i < 60; i += 1) {\n        const s = await api(`command/${cmd.id}`);\n        if (['completed', 'failed', 'aborted'].includes(s.status)) return s;\n        await sleep(2000);\n      }\n      return { status: 'timeout' };\n    };\n    const command = async (body) => waitFor(await api('command', { method: 'POST', body: JSON.stringify(body) }));\n\n    try {\n      const item = (await api(app.items)).find((s) => s.path && file.startsWith(`${s.path.replace(/\\/+$/, '')}/`));\n      if (!item) { args.jobLog(`No ${app.name} ${app.items} owns ${file}`); continue; }\n      args.jobLog(`${app.name}: ${item.title} (id ${item.id}), rescanning`);\n      const rescan = await command({ name: app.rescan, [app.idField]: item.id });\n      args.jobLog(`${app.rescan}: ${rescan.status}`);\n\n      const mf = (await api(`${app.files}?${app.idField}=${item.id}`)).find((f) => f.path.replace(/\\.[^./]+$/, '') === base);\n      if (!mf) { args.jobLog(`${app.name} has no ${app.files} matching ${file} after rescan`); return done(2); }\n      const rename = await command({ name: 'RenameFiles', [app.idField]: item.id, files: [mf.id] });\n      args.jobLog(`RenameFiles (${app.files} ${mf.id}): ${rename.status}`);\n      return done(rename.status === 'completed' ? 1 : 2);\n    } catch (err) {\n      args.jobLog(`${app.name} notify failed: ${err.message}`);\n      return done(2);\n    }\n  }\n  return done(2);\n};\n"
      },
