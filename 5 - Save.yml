      "inputsDB": {
        "code": "module.exports = async (args) => {\n  // MKVPropEdit edits files in place. Only run it on a working copy in the\n  // cache, never on the original library file (which may still be owned by\n  // the downloader / seeding torrent).\n  const workingFile = args.inputFileObj._id;\n  const originalFile = args.originalLibraryFile._id;\n  const isMkv = workingFile.toLowerCase().endsWith('.mkv');\n\n  if (workingFile === originalFile) {\n    args.jobLog('Working file is the original library file, skipping MKVPropEdit');\n    return { outputFileObj: args.inputFileObj, outputNumber: 2, variables: args.variables };\n  }\n  if (!isMkv) {\n    args.jobLog(`Working file is not mkv (${workingFile}), skipping MKVPropEdit`);\n    return { outputFileObj: args.inputFileObj, outputNumber: 2, variables: args.variables };\n  }\n  return { outputFileObj: args.inputFileObj, outputNumber: 1, variables: args.variables };\n};"
